name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/puddle-game-scoring-9e3hvi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (app + public pages + PWA assets, no keystore or sources)
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp r.html _site/r.html
          cp r.js _site/r.js
          cp privacy.html _site/privacy.html
          cp og.png _site/og.png
          cp CNAME _site/CNAME
          cp -r pwa/. _site/
          # Stamp the service-worker cache with this commit so every deploy
          # ships a fresh offline copy (and triggers the in-app update banner).
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
