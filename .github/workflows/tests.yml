name: Tests

on:
  pull_request:
  push:
    branches: [claude/puddle-game-scoring-9e3hvi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (pinned) + Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: ./scripts/run-tests.sh
