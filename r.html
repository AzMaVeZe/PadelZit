<style>
  :root{--bg:#0f172a;--card:#1e293b;--card-2:#273449;--text:#e2e8f0;--muted:#a5b4c8;--accent:#38bdf8;--accent-2:#0ea5e9;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97706;--green:#34d399;--red:#f87171;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
  .container{max-width:560px;margin:0 auto}
  h1{text-align:center;font-size:1.5rem;margin:8px 0 2px}
  h1.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900}
  h1.brand svg{width:28px;height:28px;flex:0 0 auto}
  h1.brand .latin{color:var(--accent);font-size:.95rem;font-weight:800;letter-spacing:2px;align-self:flex-end;padding-bottom:4px}
  .subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:14px}
  .live-badge{display:none;align-items:center;justify-content:center;gap:8px;margin:0 auto 16px;width:max-content;background:#450a0a;color:#fecaca;font-weight:800;font-size:.8rem;padding:6px 14px;border-radius:999px}
  .live-badge.on{display:flex}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
  @media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
  .card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .card h2{font-size:1.05rem;margin-bottom:12px;color:var(--accent)}
  .match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
  .match .team{background:var(--card-2);border-radius:12px;padding:12px 8px;text-align:center;font-weight:700;overflow-wrap:anywhere}
  .match .vs{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}
  .court-cap{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.5px;margin:10px 0 6px;text-transform:uppercase}
  .match+ .court-cap,.court-cap:not(:first-of-type){margin-top:14px}
  .resting{color:var(--muted);font-size:.85rem;text-align:center;margin-top:10px}
  .podium-first{text-align:center;padding:10px 0 4px}
  .podium-first .medal{font-size:3rem;line-height:1}
  .podium-first .name{font-size:1.6rem;font-weight:900;margin:6px 0 2px;overflow-wrap:anywhere}
  .podium-first .score{color:var(--gold);font-weight:800}
  .podium-rest{display:flex;justify-content:center;gap:24px;padding:14px 0 6px;flex-wrap:wrap}
  .podium-rest .p{text-align:center;min-width:110px}
  .podium-rest .medal{font-size:1.8rem}
  .podium-rest .name{font-weight:700;overflow-wrap:anywhere}
  .podium-rest .score{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:start;color:var(--muted);font-size:.78rem;padding:6px 8px;border-bottom:1px solid #334155}
  th.num,td.num{text-align:end}
  td{padding:10px 8px;border-bottom:1px solid #2b3a52;font-size:.95rem;overflow-wrap:anywhere}
  td.num{font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:.8rem;background:var(--card-2);color:var(--muted)}
  .rank-1{background:var(--gold);color:#422006}.rank-2{background:var(--silver);color:#1e293b}.rank-3{background:var(--bronze);color:#3a1d02}
  .pts{font-weight:800;color:var(--accent)}
  .cta{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06283d;font-weight:800;font-size:1rem}
  .note{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 0}
  .retry{display:block;margin:0 auto 16px;min-height:44px;padding:10px 22px;border-radius:999px;border:1px solid #475569;background:var(--card);color:var(--text);font-weight:700;font-size:.95rem;cursor:pointer}
</style>
</head>

<div class="container">
  <h1 class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="ballg" cx="36%" cy="30%" r="75%"><stop offset="0%" stop-color="#eef8b0"/><stop offset="55%" stop-color="#c6f23f"/><stop offset="100%" stop-color="#97c40e"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#ballg)"/><path d="M 10 12 C 26 26, 26 38, 10 52" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/><path d="M 54 12 C 38 26, 38 38, 54 52" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg>פאדלז׳יט <span class="latin">PadelZit</span></h1>
  <div class="subtitle" id="subtitle">תוצאות טורניר</div>
  <div class="live-badge" id="live-badge"><span class="live-dot"></span><span id="live-text">שידור חי</span></div>
  <div id="content"><div class="note" id="loading">טוען תוצאות…</div></div>
  <a class="cta" id="cta" href="./?ref=results">➕ פתחו טורניר משלכם — חינם</a>
  <div class="note">אמריקנו · מקסיקנו · ניקוד פאדל · PadelZit</div>
</div>

</html>
